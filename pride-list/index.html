ang Xiaoxiu’s longtime crush, confesses her love to him, the delinquent Sun Jun, who also has a crush on her, is provoked. Wang Xiaoxiu resolves the crisis with his wit and extraordinary powers, but it also brings more disasters as a result. Shen Yao is taken to the world of extraordinary beings by a mysterious person, and Wang Xiaoxiu embarks on a journey to rescue her. Fighting in the bizarre universe, he finds the meaning of fairness and justice on the path to becoming a peerless powerhouse.", "cr": null, "al": "https://anilist.co/anime/166442", "status": "FINISHED", "added": "2026-10-06", "by": "the list"}, {"n": 75, "title": "Gatchaman Crowds", "thumb": "thumbs/75.jpg", "year": 2013, "movie": false, "score": 70, "pop": 45719, "genres": ["Action", "Adventure", "Sci-Fi"], "qtags": ["LGBTQ+ Themes", "Crossdressing"], "seasons": 2, "eps": 25, "epmin": 24, "mins": 590, "ongoing": false, "desc": "The story is set in Japan in the early summer of 2015. 180,000 people live in Tachikawa City, the \"second metropolis\" of the Tokyo area. Among them are \"Gatchaman\"—warriors who fight in special reinforced suits powered by \"NOTE,\" the manifestation of special spiritual powers in living beings. A council has scouted a group of individuals with latent powers to protect Earth from alien criminals. In recent years, the council has assigned Gatchaman warriors to deal with the mysterious entity known as \"MESS.\" (Source: Anime News Network)", "cr": "https://www.crunchyroll.com/gatchaman-crowds", "al": "https://anilist.co/anime/18229", "status": "FINISHED", "added": "2026-10-07", "by": ""}, {"n": 76, "title": "Tsuredure Children", "thumb": "thumbs/76.jpg", "year": 2017, "movie": false, "score": 74, "pop": 197844, "genres": ["Comedy", "Drama", "Romance", "Slice of Life"], "qtags": [], "seasons": 1, "eps": 12, "epmin": 13, "mins": 156, "ongoing": false, "desc": "To those of you out there who never could say \"I love you\"— This story is about ordinary highschoolers and how love ined, something of equal value must be lost.\"\n\nAlchemy is bound by this Law of Equivalent Exchange—something the young brothers Edward and Alphonse Elric only realize after attempting human transmutation: the one forbidden act of alchemy. They pay a terrible price for their transgression—Edward loses his left leg, Alphonse his physical body. It is only by the desperate sacrifice of Edward's right arm that he is able to affix Alphonse's soul to a suit of armor. Devastated and alone, it is the hope that they would both eventually return to their original bodies that gives Edward the inspiration to obtain metal limbs called \"automail\" and become a state alchemist, the Fullmetal Alchemist.\n\nThree years of searching later, the brothers seek the Philosopher's Stone, a mythical relic that allows an alchemist to overcome the Law of Equivalent Exchange. Even with military allies Colonel Roy Mustang, Lieutenant Riza Hawkeye, and Lieutenant Colonel Maes Hughes on their side, the brothers find themselves caught up in a nationwide conspiracy that leads them not only to the true nature of the elusive Philosopher's Stone, but their country's murky history as well. In between finding a serial killer and racing against time, Edward and Alphonse must ask themselves if what they are doing will make them human again... or take away their humanity.", "cr": "http://www.crunchyroll.com/fullmetal-alchemist-brotherhood", "al": "https://anilist.co/anime/5114", "status": "FINISHED", "added": "2026-10-15", "by": ""}, {"n": 79, "title": "MARRIAGETOXIN", "thumb": "thumbs/79.jpg", "year": 2026, "movie": false, "score": 76, "pop": 92839, "genres": ["Action", "Comedy", "Drama", "Romance"], "qtags": ["Bisexual", "LGBTQ+ Themes"], "seasons": 1, "eps": 13, "epmin": 24, "mins": 312, "ongoing": false, "desc": "For centuries, the deadly arts have been perfected by those known as the Masters.\nAmong them, the Poison Masters of the Five Great Families hold the most fearsome power and influence. \nHi g to survive in a technology and body modification-obsessed city of the future. Having everything to lose, he chooses to stay alive by becoming an edgerunner—a mercenary outlaw also known as a cyberpunk.\n\n(Source: CD PROJEKT RED)\n\nNote: The first episode received a pre-screening at Anime Expo on July 2, 2022. The first 3 dubbed episodes were streamed on Twitch as part of a co-stream promotion on September 12, a day before the show’s premiere.", "cr": null, "al": "https://anilist.co/anime/120377", "status": "FINISHED", "added": "2026-10-15", "by": "", "w": ["Netflix", "https://www.netflix.com/title/81054853"]}]</script>
<script>
(function(){
const items=JSON.parse(document.getElementById('data').textContent);
const grid=document.getElementById('grid'),empty=document.getElementById('empty'),q=document.getElementById('q');
let sort='score',g='',text='';
const open=new Set();
let takes={};const openTk=new Set();
function fitTk(){grid.querySelectorAll('.tk:not(.open)').forEach(d=>{const p=d.querySelector('p');d.querySelector('.more').hidden=p.scrollHeight<=p.clientHeight+1;});}
function takesHtml(i){const t=takes[i.n];if(!t)return '';const r=[['frost','Frost'],['chaz','Chaz']].filter(([k])=>t[k]).map(([k,n])=>{const id=i.n+':'+k,o=openTk.has(id);return `<div class="tk${o?' open':''}"><p class="${k}"><b>${n}:</b>${esc(t[k])}</p><button class="more ${k}" data-tk="${id}" aria-expanded="${o}">${o?'Less':'More'}</button></div>`;}).join('');return r?`<div class="takes">${r}</div>`:'';}
function hm(m){if(!m)return '';const h=Math.floor(m/60),mm=m%60;return (h?h+'h ':'')+(mm?mm+'m':'')||'0m';}
const FIRST='2026-10-06';
function fmt(d){if(!d)return '';const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function ago(d){if(d===FIRST)return 'The original list';const t=new Date();const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());const [y,m,dd]=d.split('-').map(Number);const n=Math.round((today-new Date(y,m-1,dd))/864e5);if(n<=0)return 'Added today';if(n===1)return 'Added yesterday';if(n<14)return `Added ${n} days ago`;if(n<60)return `Added ${Math.round(n/7)} weeks ago`;return `Added ${Math.round(n/30)} months ago`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function stars(s){const pct=s?Math.round(s)+'%':'0%';return `<span class="st" aria-hidden="true">★★★★★<i style="width:${pct}">★★★★★</i></span>`;}
function meta(i){
  if(i.movie) return `<b>Film</b> · ${hm(i.mins)}`;
  const parts=[];
  if(i.seasons>1) parts.push(`<b>${i.seasons} seasons</b>`);
  parts.push(`<b>${i.eps}</b> eps${i.ongoing?' so far':''}`);
  if(i.epmin) parts.push(`${i.epmin} min`);
  parts.push(`<b>${hm(i.mins)}</b> total`);
  return parts.join(' · ');
}
function card(i){
  if(i.missing) return `<article class="card"><img src="${i.thumb}" alt=""><div class="head"><h2 class="t">${esc(i.title)}</h2><p class="meta">No listing found</p></div></article>`;
  const chips=[...i.qtags.map(t=>`<span class="q">${esc(t)}</span>`),...i.genres.map(t=>`<span>${esc(t)}</span>`)].join('');
  const cr=i.cr?`<a class="cr" href="${esc(i.cr)}" target="_blank" rel="noopener">Crunchyroll ↗</a>`:i.w?`<a class="cr" href="${esc(i.w[1])}" target="_blank" rel="noopener">${esc(i.w[0])} ↗</a>`:`<a class="cr off" href="https://www.crunchyroll.com/search?q=${encodeURIComponent(i.title)}" target="_blank" rel="noopener">Search Crunchyroll ↗</a>`;
  return `<article class="card${open.has(i.n)?' open':''}" data-n="${i.n}">
   <img src="${i.thumb}" alt="" loading="lazy" width="320" height="180">
   <div class="head">
    <h2 class="t">${esc(i.title)}<small>${i.year||''}</small></h2>
    <div class="stars">${stars(i.score)}<span class="sc">${i.score??'–'}<small> /100</small></span></div>
    <p class="meta">${meta(i)}</p>
   </div>
   <div class="body">
    ${takesHtml(i)}
    <div class="chips">${chips}</div>
    <p class="d">${esc(i.desc)}</p>
    <div class="acts"><button class="more" data-more="${i.n}" aria-expanded="${open.has(i.n)}">${open.has(i.n)?'Less':'More'}</button>${cr}</div>
   </div></article>`;
}
function render(){
  let list=items.filter(i=>!i.missing||!g);
  if(g==='__queer') list=list.filter(i=>i.qtags&&i.qtags.length);
  else if(g) list=list.filter(i=>(i.genres||[]).includes(g));
  if(text) list=list.filter(i=>i.title.toLowerCase().includes(text));
  const by={score:(a,b)=>(b.score||0)-(a.score||0),new:(a,b)=>(b.added||'').localeCompare(a.added||'')||b.n-a.n,short:(a,b)=>(a.mins||1e9)-(b.mins||1e9),long:(a,b)=>(b.mins||0)-(a.mins||0),az:(a,b)=>a.title.localeCompare(b.title)}[sort];
  list.sort(by);
  if(sort==='new'){let last=null,out='';for(const i of list){if(i.added!==last){last=i.added;out+=`<h2 class="when">${ago(i.added)}<small>${fmt(i.added)}</small></h2>`;}out+=card(i);}grid.innerHTML=out;}
  else grid.innerHTML=list.map(card).join('');
  empty.hidden=list.length>0;
  requestAnimationFrame(fitTk);
}
document.getElementById('sorts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;sort=b.dataset.sort;for(const x of e.currentTarget.children)x.setAttribute('aria-pressed',x===b);render();});
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g=b.dataset.g;for(const x of e.currentTarget.children)x.setAttribute('aria-pressed',x===b);render();});
q.addEventListener('input',()=>{text=q.value.trim().toLowerCase();render();});
grid.addEventListener('click',e=>{const tb=e.target.closest('[data-tk]');if(tb){const id=tb.dataset.tk,o=!openTk.has(id);o?openTk.add(id):openTk.delete(id);tb.closest('.tk').classList.toggle('open',o);tb.textContent=o?'Less':'More';tb.setAttribute('aria-expanded',o);return;}const m=e.target.closest('[data-more]');if(!m)return;const n=+m.dataset.more;open.has(n)?open.delete(n):open.add(n);const c=m.closest('.card');c.classList.toggle('open',open.has(n));m.textContent=open.has(n)?'Less':'More';m.setAttribute('aria-expanded',open.has(n));});
render();
window.addEventListener('resize',fitTk);if(document.fonts)document.fonts.ready.then(fitTk);
fetch('takes.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(t=>{takes=t||{};render();}).catch(()=>{});
})();
</script>
</body></html>
